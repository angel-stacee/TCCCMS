name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Android SDK and Accept Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build Android APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK File
        run: |
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} tcc-clinic.apk \;
          ls -lh tcc-clinic.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcc-clinic-apk
          path: tcc-clinic.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: android-app
          name: "TCC Clinic Android App (.apk)"
          body: |
            ## 📱 TCC Clinic Management System — Android APK
            
            Download the official **`tcc-clinic.apk`** below directly onto your Android phone:
            
            - **Live Database Connected**: Fully synchronized with the Railway backend database.
            - **Official TCC College Seal App Icon**: High-contrast, clean Android adaptive icon.
            - **Native Android Experience**: Standalone app without browser bars.
            
            ### How to install on your phone:
            1. Tap **`tcc-clinic.apk`** below under **Assets** to download.
            2. Tap **Open** / **Install** on your phone (allow "Install unknown apps" if prompted).
          files: tcc-clinic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
