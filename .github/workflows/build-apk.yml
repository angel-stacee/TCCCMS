name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

      - name: Copy Assets & Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk tcc-clinic.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tcc-clinic-android-apk
          path: tcc-clinic.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: "TCC Clinic Android APK Release"
          body: |
            ## 📱 TCC Clinic Management System — Android APK
            
            Download the official **`tcc-clinic.apk`** below directly onto your Android phone:
            
            - **Live Database Connected**: Fully synchronized with the Railway backend database.
            - **High-Definition TCC College Seal App Icon**: High-contrast, clean Android adaptive icon.
            - **Offline-Safe & Standalone**: Native Android WebView experience.
            
            ### How to install on your phone:
            1. Tap **`tcc-clinic.apk`** below to download.
            2. Tap **Open** / **Install** on your phone (allow "Install from Unknown Sources" if prompted).
          files: tcc-clinic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
